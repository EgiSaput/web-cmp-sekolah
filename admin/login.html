<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12345a">
  <title>Login Petugas CMS | Sekolah Rahayu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1>CMS Sekolah Rahayu</h1>
        <p>Portal Administrasi & Pengelolaan Konten</p>
      </div>

      <div class="login-demo-badge">
        <strong><i class="fa-solid fa-circle-info"></i> Akun Demo Petugas:</strong>
        Email: <code>admin@sekolahrahayu.sch.id</code><br>
        Kata Sandi: <code>admin123</code>
      </div>

      <form id="adminLoginForm">
        <div class="form-group-admin">
          <label for="adminUsername">Email / Username</label>
          <input type="text" id="adminUsername" value="admin@sekolahrahayu.sch.id" required placeholder="Masukkan email petugas">
        </div>

        <div class="form-group-admin">
          <label for="adminPassword">Kata Sandi</label>
          <input type="password" id="adminPassword" value="admin123" required placeholder="Masukkan kata sandi">
        </div>

        <div id="loginError" style="display: none; color: #ef4444; font-size: 12px; margin-bottom: 14px; font-weight: 600;"></div>

        <button type="submit" class="btn-primary-admin" style="width: 100%; justify-content: center;">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Dashboard CMS
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <a href="../index.html" style="color: var(--admin-text-muted); font-size: 12px; text-decoration: none; font-weight: 600;">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Website Utama
        </a>
      </div>
    </div>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in, redirect to dashboard
      if (window.StorageEngine && window.StorageEngine.isLoggedIn()) {
        window.location.href = "index.html";
        return;
      }

      const form = document.getElementById("adminLoginForm");
      const errEl = document.getElementById("loginError");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        errEl.style.display = "none";

        const u = document.getElementById("adminUsername").value.trim();
        const p = document.getElementById("adminPassword").value.trim();

        const res = window.StorageEngine.login(u, p);
        if (res.success) {
          window.location.href = "index.html";
        } else {
          errEl.textContent = res.message;
          errEl.style.display = "block";
        }
      });
    });
  </script>
</body>
</html>
